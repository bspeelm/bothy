name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # The gates run again here rather than trusting the branch: a tag can be
      # pushed at any commit, including one CI never saw.
      - run: make check
      # The spec is the one place a version is written; the tag is derived from
      # it by `make release-tag`. A hand-made tag can disagree, and then
      # goreleaser stamps the binary and the .deb from the tag while Copr reads
      # the spec -- two published versions of one release. Same sed expression
      # release-tag, copr and .copr/Makefile already share.
      - name: the tag matches the spec
        run: |
          v=$(sed -n 's/^Version:[[:space:]]*//p' packaging/bothy.spec)
          test "v$v" = "${GITHUB_REF_NAME}" || {
            echo "::error::tag ${GITHUB_REF_NAME} but the spec says $v"; exit 1; }
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
