name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Keyless signing: id-token mints the OIDC token that binds the certificate
  # to this workflow, attestations writes the result. There is no private key
  # to store, rotate or leak, which is the whole reason for choosing this over
  # a personal one (ADR-030).
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # The gates run again here rather than trusting the branch: a tag can be
      # pushed at any commit, including one CI never saw.
      - run: make check
      # The spec is the one place a version is written; the tag is derived from
      # it by `make release-tag`. A hand-made tag can disagree, and then
      # goreleaser stamps the binary and the .deb from the tag while Copr reads
      # the spec -- two published versions of one release. Same sed expression
      # release-tag, copr and .copr/Makefile already share.
      - name: the tag matches the spec
        run: |
          v=$(sed -n 's/^Version:[[:space:]]*//p' packaging/bothy.spec)
          test "v$v" = "${GITHUB_REF_NAME}" || {
            echo "::error::tag ${GITHUB_REF_NAME} but the spec says $v"; exit 1; }
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The tap and the AUR package publish to other repositories, which
          # GITHUB_TOKEN cannot reach: it is scoped to this one. Both are read
          # as .Env values, so both must be set here even when empty -- a name
          # goreleaser cannot resolve fails the release after the tag is pushed,
          # which is how 0.8.0 shipped without its cask.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
      # Everything the release page offers, not just the archives. Attesting
      # the tarballs alone would leave the .deb unsigned and checksums.txt --
      # the file the default install trusts -- swappable by whoever could swap
      # the artifact it vouches for.
      - name: sign the release artifacts
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/bothy_*.tar.gz
            dist/bothy-*-source.tar.gz
            dist/*.deb
            dist/checksums.txt
      # The bundle is published beside the artifacts so that verifying needs no
      # GitHub account. `gh attestation verify` without --bundle asks the API,
      # which requires a login; with one it reads from disk.
      - name: publish the attestation bundle
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" attestation.jsonl
          gh release upload "${GITHUB_REF_NAME}" attestation.jsonl --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
