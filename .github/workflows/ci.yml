name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only for every job here. Nothing in CI writes to the repository -- the
# release workflow is the only thing that needs contents: write -- and the
# default token is far broader than any of this needs.
permissions:
  contents: read

jobs:
  # Which jobs below have anything to look at. A change that is only markdown
  # cannot alter what bothy installs, so the jobs that build and install it sit
  # the run out.
  #
  # Two jobs never sit it out. `check` runs cmd/bothy/docs_test.go, which reads
  # the markdown, and no-paid-palette scans it for colour values; both would go
  # blind on exactly the changes this is meant to speed up.
  #
  # The jobs are skipped, not the workflow. A required check whose workflow
  # never runs leaves the pull request pending forever, while a job skipped by
  # `if:` reports and satisfies it.
  scope:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.probe.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: probe
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # No base to diff against -- a new branch, or a rewritten history.
          # Run everything: guessing wrong here skips the build.
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "no base commit; running everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "$changed"
          # An empty list prints one empty line, which is not markdown, so the
          # unexpected case runs everything too.
          if printf '%s\n' "$changed" | grep -qv '\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # `make check` runs lint, the tests, and the PLAN.md §0 budget assertions.
      - run: make check

  isolation:
    # ADR-009 as a gate: installing must write nothing outside bothy's own
    # directory. `go test -run` exits 0 when its filter matches nothing, so the
    # filter is asserted to match.
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: isolation tests actually ran
        run: |
          out=$(go test ./internal/install/ -run 'Isolation|WritesNothingOutside|NeverWrites|Passthrough|Uninstall' -v)
          echo "$out"
          ran=$(echo "$out" | grep -c '^--- PASS' || true)
          echo "isolation tests passed: $ran"
          if [ "$ran" -lt 5 ]; then
            echo "::error::expected at least 5 isolation tests, ran $ran — the filter has drifted"
            exit 1
          fi

  no-paid-palette:
    # ADR-006. The only colour values in this repository are open Dracula's.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go test ./internal/theme/ -run OnlyOpenDracula -v

  container:
    # PLAN.md §10 named this as the last thing before v0.2.0: "run it on a
    # distro that is not Fedora". Everything else here is verified on Fedora
    # and Fedora only, which is three environments and one distribution.
    #
    # The assertions are Go, in cmd/bothy/container_test.go, behind a build tag
    # so `make check` needs neither a container runtime nor a network. Docker
    # rather than podman: it is what the runner has.
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # One list, read by the pull loop and by the assertion that each distro
    # ran. The Go test keeps its own in container_test.go; a test pairs them.
    env:
      IMAGES: "fedora:44 ubuntu:24.04 debian:trixie archlinux:latest"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # CGO_ENABLED=0, via the Makefile, so the binary carried into the
      # containers is the one goreleaser ships rather than one linked against
      # the runner's glibc.
      - run: make build

      # Pulled here with retries rather than left to the test: a registry
      # hiccup would otherwise block every merge.
      - name: pull the base images
        run: |
          set -euo pipefail
          for image in $IMAGES; do
            for attempt in 1 2 3; do
              if docker pull "$image"; then
                continue 2
              fi
              echo "pull of $image failed (attempt $attempt)"
              sleep $((attempt * 10))
            done
            echo "::error::could not pull $image after 3 attempts"
            exit 1
          done

      - name: install, verify and uninstall in each container
        # pipefail, or `go test | tee` reports tee's exit code and a failing
        # test is green.
        run: |
          set -o pipefail
          go test ./cmd/bothy/ -tags container -timeout 20m -v \
            -run TestBothyInstallsInAContainer | tee container.log
          # `go test -run` exits 0 when its filter matches nothing; assert
          # each distro ran. Derived from IMAGES so this list cannot fall
          # behind the one the test iterates.
          for image in $IMAGES; do
            distro="${image%%:*}"
            grep -qE -- "--- PASS: .*/${distro}" container.log || {
              echo "::error::no subtest ran for ${distro} — the -run filter or the build tag has drifted"
              exit 1
            }
          done

  macos:
    # ADR-012: a platform is supported when CI installs it, runs the doctor and
    # matches an expected table. The README has listed macOS since v0.1.0 and
    # nothing has ever proved it.
    #
    # This cannot reuse the container job's shape. There is no container to
    # bind-mount a home into, so it installs into a temporary HOME on the
    # runner and walks that instead. The assertions themselves are shared, in
    # cmd/bothy/harness_test.go, so the two jobs cannot come to demand
    # different things.
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: make build

      - name: install, verify and uninstall
        # pipefail, or `go test | tee` reports tee's exit code and a failing
        # test is green.
        run: |
          set -o pipefail
          go test ./cmd/bothy/ -tags macos -timeout 15m -v \
            -run TestBothyInstallsOnMacOS | tee macos.log
          # `go test -run` exits 0 when its filter matches nothing.
          grep -q -- "--- PASS: TestBothyInstallsOnMacOS" macos.log || {
            echo "::error::the test did not run — the -run filter or the build tag has drifted"
            exit 1
          }

  deb:
    # The .deb only exists once a release is published, so without this the
    # first `apt install` of one happens after the tag is irrevocable.
    # --snapshot builds the artifact set and publishes none of it.
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # goreleaser needs tags to compute the snapshot version.
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --snapshot --clean --skip=publish
      - name: install it, run it, remove it
        run: |
          set -euo pipefail
          deb=$(ls dist/bothy_*_amd64.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          sudo apt-get install -y "./$deb"
          # From /usr/bin, not from the build tree.
          test "$(command -v bothy)" = /usr/bin/bothy
          bothy version
          # -trimpath is a claim about the binary that ships, so check the
          # binary that ships. v0.9.0 went out carrying 69 absolute paths from
          # this runner's workspace, and only goreleaser's own build would have
          # shown it -- `make check` builds with the Makefile's flags, not
          # these.
          if grep -qa "$GITHUB_WORKSPACE/vendor/" /usr/bin/bothy; then
            echo "::error::the packaged binary embeds build paths; -trimpath is not taking"
            exit 1
          fi
          # No dependencies is a claim (ADR-013), so check it rather than
          # assume it -- an accidental Depends: would pull perl onto the
          # machine of someone who wanted one static binary.
          test -z "$(dpkg-deb -f "$deb" Depends)"
          sudo apt-get remove -y bothy
          # Test the file, not the name. `command -v` consults bash's hash
          # table, which still held /usr/bin/bothy from running it above, so
          # it reported the binary present after apt had removed it.
          test ! -e /usr/bin/bothy
