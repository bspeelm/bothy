# The multiplexer. This minimum is the one that matters most.
#
# 0.45.0 implemented the Kitty graphics protocol and 0.45.1 fixed image sizing
# on startup. Below that, Yazi's image previews fall back to chafa block art,
# and the terminal's mangled reply to Yazi's capability query is parsed as
# keystrokes — the phantom "Find next" documented in docs/origin-cheatsheet.md.
# Fedora's COPR still ships 0.42.2, which is why this is not academic.

name      = "zellij"
what      = "the multiplexer"
slot      = "mux"
platforms = ["linux", "darwin"]
provides  = ["panes", "sessions", "theme"]

[fetch]
binary      = "zellij"
repo        = "zellij-org/zellij"
min_version = "0.45.1"
reason      = "image previews need the Kitty graphics protocol, added in 0.45"
# The sibling file is the asset name with .tar.gz swapped for .sha256sum, and
# it hashes the binary inside rather than the archive.
checksums       = "{asset_stem}.sha256sum"
checksum_covers = "binary"

[fetch.assets]
linux_x86_64   = "zellij-x86_64-unknown-linux-musl.tar.gz"
linux_aarch64  = "zellij-aarch64-unknown-linux-musl.tar.gz"
darwin_x86_64  = "zellij-x86_64-apple-darwin.tar.gz"
darwin_aarch64 = "zellij-aarch64-apple-darwin.tar.gz"

[[file]]
template = "templates/mux/zellij/config.kdl.tmpl"
dest     = "zellij/config.kdl"

[[file]]
template = "templates/mux/zellij/theme.kdl.tmpl"
dest     = "zellij/themes/{theme}.kdl"
