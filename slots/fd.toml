# Note the leading v in the asset name, which the others do not have.
#
# Debian and Ubuntu install the binary as `fdfind`, so LookPath("fd") misses
# and bothy fetches its own copy even where one exists. That is deliberate:
# what bothy promises a session is that `fd` is on PATH, for you to type and
# for yazi and lazygit to find when they shell out.

name      = "fd"
what      = "a faster find"
platforms = ["linux", "darwin"]

[fetch]
binary      = "fd"
repo        = "sharkdp/fd"
min_version = "8.0.0"

[fetch.assets]
linux_x86_64   = "fd-v{version}-x86_64-unknown-linux-musl.tar.gz"
linux_aarch64  = "fd-v{version}-aarch64-unknown-linux-gnu.tar.gz"
darwin_x86_64  = "fd-v{version}-x86_64-apple-darwin.tar.gz"
darwin_aarch64 = "fd-v{version}-aarch64-apple-darwin.tar.gz"
