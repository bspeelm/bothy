# The file browser. Ships two binaries: yazi and its package manager, ya.
#
# Every current yazi-rs plugin refuses to load below 26.x with
# "requires at least Yazi 26.x", and bothy's config uses the 26.x key names
# ([mgr], and `url` in fetchers and filetype rules).

name      = "yazi"
what      = "the file browser"
slot      = "browser"
platforms = ["linux", "darwin"]
provides  = ["images", "theme"]

[fetch]
binary      = "yazi"
extra       = ["ya"]
repo        = "sxyazi/yazi"
min_version = "26.0.0"
reason      = "the plugin ecosystem and bothy's config both require 26.x keys"

[fetch.assets]
linux_x86_64   = "yazi-x86_64-unknown-linux-musl.zip"
linux_aarch64  = "yazi-aarch64-unknown-linux-musl.zip"
darwin_x86_64  = "yazi-x86_64-apple-darwin.zip"
darwin_aarch64 = "yazi-aarch64-apple-darwin.zip"

[[file]]
template = "templates/browser/yazi/yazi.toml.tmpl"
dest     = "yazi/yazi.toml"

[[file]]
template = "templates/browser/yazi/keymap.toml.tmpl"
dest     = "yazi/keymap.toml"

[[file]]
template = "templates/browser/yazi/init.lua.tmpl"
dest     = "yazi/init.lua"

[[file]]
template = "templates/browser/yazi/theme.toml.tmpl"
dest     = "yazi/theme.toml"

[[file]]
template = "templates/browser/yazi/enter-hint.lua.tmpl"
dest     = "yazi/plugins/enter-hint.yazi/main.lua"
when     = "no-images"

# Yazi plugins bothy's generated config depends on.
#
# These are not decoration. bothy's init.lua, keymap.toml and yazi.toml all
# reference them, so a missing one is not a missing feature — it is a config
# that fails at launch. The generated files are therefore written to match what
# is actually installed, and `bothy doctor` reports the difference.
#
# They are installed with Yazi's own package manager, which honours
# YAZI_CONFIG_HOME, so they land inside bothy's tree without vendoring anyone's
# code (PLAN.md §11, NOTICE).
#
# `rev` is the pin. `ya pkg add` records a revision too, but it records
# whatever HEAD was on that machine on that day -- so two people installing a
# week apart got different plugins. bothy writes package.toml from these
# revisions instead and runs `ya pkg install`, which checks out exactly what is
# named here. Never `ya pkg upgrade`: it moves the revision to HEAD, which is
# the behaviour this pin exists to prevent.
#
# To move a pin: change the sha, install, and check the plugin still works.
#
# `hash` is not written here. ya keeps one in its own package.toml as a record
# of what it deployed, and refuses to touch a plugin whose directory no longer
# matches it. It ignores a hash it is handed -- given a wrong one it overwrites
# it and reports success -- so a hash committed here would verify nothing. The
# rev is the integrity pin: a full git SHA names its own content.

[[plugin]]
name  = "git"
use   = "yazi-rs/plugins:git"
rev   = "c591a36e7263e95497715d525e9c46c2f0a880ac"
gives = "per-file git status in the listing"
needs = ["init", "fetcher"]

[[plugin]]
name  = "full-border"
use   = "yazi-rs/plugins:full-border"
rev   = "c591a36e7263e95497715d525e9c46c2f0a880ac"
gives = "closed pane borders, so the theme reads as a full frame"
needs = ["init"]

[[plugin]]
name  = "smart-enter"
use   = "yazi-rs/plugins:smart-enter"
rev   = "c591a36e7263e95497715d525e9c46c2f0a880ac"
gives = "l opens a file or enters a directory"
needs = ["keymap"]

[[plugin]]
name  = "chmod"
use   = "yazi-rs/plugins:chmod"
rev   = "c591a36e7263e95497715d525e9c46c2f0a880ac"
gives = "c m to chmod without dropping to a shell"
needs = ["keymap"]
