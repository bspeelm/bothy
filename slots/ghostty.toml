# Ghostty is advised, never installed: it publishes no release binaries, and
# every install path needs root (and on image-based hosts, a reboot).

name      = "ghostty"
what      = "a terminal that can draw inline images"
slot      = "terminal"
platforms = ["linux", "darwin"]
provides  = ["images", "theme"]

[advise.install]
fedora-ostree  = "sudo curl -fsSL -o /etc/yum.repos.d/_copr_scottames-ghostty.repo https://copr.fedorainfracloud.org/coprs/scottames/ghostty/repo/fedora-$(rpm -E %fedora)/scottames-ghostty-fedora-$(rpm -E %fedora).repo && sudo rpm-ostree install ghostty && systemctl reboot"
fedora         = "sudo dnf copr enable scottames/ghostty -y && sudo dnf install -y ghostty"
ubuntu         = "see https://ghostty.org/docs/install — Ubuntu has no official package yet"
debian         = "see https://ghostty.org/docs/install — Debian has no official package yet"
arch           = "sudo pacman -S ghostty"
darwin         = "brew install --cask ghostty"

[[advise.avoid]]
repo           = "copr pgdev/ghostty"
why            = "no builds for current Fedora; it blocks rpm-ostree upgrades until removed"
distros        = ["fedora"]

[[advise.avoid]]
repo           = "copr ldivizio/tools, copr kray74/cli-tools"
why            = "they bundle ten-plus packages that shadow ripgrep, fd, fzf, jq and delta from Fedora proper"
distros        = ["fedora"]

[[file]]
template = "templates/terminal/ghostty/config.tmpl"
dest     = "ghostty.conf"
