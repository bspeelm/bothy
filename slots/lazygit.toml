# Git TUI for the side pane. Any recent version does.
# Note the asset name carries the version without its leading v.

name      = "lazygit"
what      = "the git TUI"
platforms = ["linux", "darwin"]

[fetch]
binary      = "lazygit"
repo        = "jesseduffield/lazygit"
min_version = "0.40.0"
checksums   = "checksums.txt"

[fetch.assets]
linux_x86_64   = "lazygit_{version}_linux_x86_64.tar.gz"
linux_aarch64  = "lazygit_{version}_linux_arm64.tar.gz"
darwin_x86_64  = "lazygit_{version}_darwin_x86_64.tar.gz"
darwin_aarch64 = "lazygit_{version}_darwin_arm64.tar.gz"
