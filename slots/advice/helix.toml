# helix is advised, never installed. bothy supplies no editor at all (ADR-014)
# -- and helix publishes only tar.xz, which bothy cannot unpack, so it could
# not be supplied even if that changed.

name = "helix"
what = "the editor in the editor profile"
binary = "hx"

[install]
fedora-ostree = "sudo rpm-ostree install helix && systemctl reboot"
fedora        = "sudo dnf install -y helix"
ubuntu        = "sudo snap install --classic helix"
debian        = "see https://docs.helix-editor.com/install.html — Debian has no official package"
arch          = "sudo pacman -S helix"
darwin        = "brew install helix"
