# vim is advised, never installed. bothy supplies no editor (ADR-014); the
# slot names the binary and sets EDITOR.

name = "vim"
what = "the editor in the editor profile"
binary = "vim"

[install]
fedora-ostree = "sudo rpm-ostree install vim-enhanced && systemctl reboot"
fedora        = "sudo dnf install -y vim-enhanced"
debian        = "sudo apt install -y vim"
arch          = "sudo pacman -S vim"
darwin        = "vim ships with macOS; if it is missing, brew install vim"
