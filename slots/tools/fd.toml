# Note the leading v in the asset name, which the others do not have.
#
# On Debian and Ubuntu the package is fd-find and the binary is installed as
# `fdfind`, because `fd` was already taken by fdclone. So LookPath("fd") misses
# and bothy fetches its own copy even on a machine that has one.
#
# That is the right outcome, and deliberate. What bothy promises a session is
# that `fd` is on PATH -- for you to type, and for yazi and lazygit to find
# when they shell out. A binary called `fdfind` does not satisfy that, and the
# only way to make it would be for bothy to invent the name Debian renamed to
# avoid a clash. A 3.7 MB download is the cheaper mistake.
name        = "fd"
binary      = "fd"
repo        = "sharkdp/fd"
min_version = "8.0.0"

[assets]
linux_x86_64   = "fd-v{version}-x86_64-unknown-linux-musl.tar.gz"
linux_aarch64  = "fd-v{version}-aarch64-unknown-linux-gnu.tar.gz"
darwin_x86_64  = "fd-v{version}-x86_64-apple-darwin.tar.gz"
darwin_aarch64 = "fd-v{version}-aarch64-apple-darwin.tar.gz"
