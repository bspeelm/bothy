# sshfs is advised, never installed: it publishes source tarballs only
# (sshfs-3.7.6.tar.xz and a signature, no binaries), so there is nothing for
# bothy.lock to pin, and every install path is a package manager and root.
# ADR-046 records why there is no alternative.
#
# It fills no slot. `bothy connect` needs it and nothing else does.
#
# macOS goes to FUSE-T rather than macFUSE. macFUSE needs a kernel extension,
# which on Apple Silicon means booting into reduced security to allow it, and
# Homebrew core dropped sshfs after macFUSE's licence changed. FUSE-T is
# kext-free -- it serves FUSE over a local loopback instead -- and its
# fuse-t-sshfs cask depends on fuse-t, so one command brings both. It installs
# the binary as `sshfs`, which is what connect looks for.

name      = "sshfs"
what      = "mounts another machine's files, for 'bothy connect'"
platforms = ["linux", "darwin"]

[advise.install]
# On an image-based host, install it in the toolbox bothy runs in rather than
# layering it: the mount is visible to the processes that share that namespace,
# which is exactly the workspace, and it costs no reboot.
fedora-ostree = "inside your toolbox: sudo dnf install -y sshfs"
fedora        = "sudo dnf install -y sshfs"
ubuntu        = "sudo apt install -y sshfs"
debian        = "sudo apt install -y sshfs"
arch          = "sudo pacman -S sshfs"
darwin        = "brew tap macos-fuse-t/homebrew-cask && brew install --cask fuse-t-sshfs"
default       = "install sshfs with your package manager"
