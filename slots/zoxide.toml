name      = "zoxide"
what      = "a directory jumper"
platforms = ["linux", "darwin", "windows"]

[fetch]
binary      = "zoxide"
repo        = "ajeetdsouza/zoxide"
min_version = "0.9.0"

[fetch.assets]
linux_x86_64   = "zoxide-{version}-x86_64-unknown-linux-musl.tar.gz"
linux_aarch64  = "zoxide-{version}-aarch64-unknown-linux-musl.tar.gz"
darwin_x86_64  = "zoxide-{version}-x86_64-apple-darwin.tar.gz"
darwin_aarch64 = "zoxide-{version}-aarch64-apple-darwin.tar.gz"
windows_x86_64 = "zoxide-{version}-x86_64-pc-windows-msvc.zip"
